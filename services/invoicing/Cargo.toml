[package]
name = "invoicing-service"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity <agy@deepmind.google>", "Zoro"]
description = "High-performance Rust invoicing and financial ledger engine with exact decimal precision"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"
