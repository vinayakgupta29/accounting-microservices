syntax = "proto3";

package inventory.v1;

option go_package = "github.com/accounting-microservices/proto/inventory/v1;inventoryv1";

// InventoryService manages product catalog, pricing, and transactional stock reservations.
service InventoryService {
  // AddProduct creates or updates a product in tenant inventory.
  rpc AddProduct(AddProductRequest) returns (AddProductResponse);

  // GetProduct retrieves a single product by ID.
  rpc GetProduct(GetProductRequest) returns (Product);

  // ListProducts lists all products in tenant catalog.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  // ReserveStock reserves quantities of items for an in-flight invoice.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // CommitStock permanently deducts reserved stock upon successful invoice creation.
  rpc CommitStock(CommitStockRequest) returns (CommitStockResponse);

  // ReleaseStock cancels a reservation and restores available stock.
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message Product {
  int64 id = 1;
  string tenant_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  string created_at = 6;
  string updated_at = 7;
}

message AddProductRequest {
  string tenant_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message AddProductResponse {
  Product product = 1;
  string message = 2;
}

message GetProductRequest {
  string tenant_id = 1;
  int64 product_id = 2;
}

message ListProductsRequest {
  string tenant_id = 1;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string tenant_id = 1;
  string reservation_id = 2;
  repeated StockItem items = 3;
}

message ReserveStockResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
  repeated Product products = 4; // Products with unit prices for billing calculations
}

message CommitStockRequest {
  string tenant_id = 1;
  string reservation_id = 2;
}

message CommitStockResponse {
  bool success = 1;
  string message = 2;
}

message ReleaseStockRequest {
  string tenant_id = 1;
  string reservation_id = 2;
}

message ReleaseStockResponse {
  bool success = 1;
  string message = 2;
}
